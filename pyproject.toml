[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "state-forecast"
version = "0.1.0"
description = "Joint measurement-only state estimation and differentiable dynamics learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
examples = ["numpy>=2.0", "matplotlib>=3.9"]
notebooks = ["numpy>=2.0", "matplotlib>=3.9", "jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10", "nbconvert>=7"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["state_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

